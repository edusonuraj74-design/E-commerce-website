<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My E-Commerce Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            MyShop
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="cart">
            🛒 Cart <span id="cart-count">0</span>
        </div>

    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div>
            <h1>Welcome to MyShop</h1>

            <p>
                Find the best products at the best prices.
            </p>

            <button>Shop Now</button>
        </div>

    </section>


    <!-- Search -->
    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

    </section>


    <!-- Products -->
    <main>

        <h2>Our Products</h2>

        <div class="products" id="products">


            <!-- Product 1 -->
            <div class="product-card">

               <img
             src="images/smartwatch.jpg"
             alt="Smart Watch"
             >

                <h3>Smart Watch</h3>

                <p>₹1,999</p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>


            <!-- Product 2 -->
            <div class="product-card">

                <img
                    src="images/Headphones.jpg"
                    alt="Headphones"
                >

                <h3>Headphones</h3>

                <p>₹1,499</p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>


            <!-- Product 3 -->
            <div class="product-card">

                <img
                    src="images/Keyboard.jpg"
                    alt="Keyboard"
                >

                <h3>Keyboard</h3>

                <p>₹999</p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>


            <!-- Product 4 -->
            <div class="product-card">

                <img
                src="images/Mouse.jpg"
                    alt="Mouse"
                >

                <h3>Wireless Mouse</h3>

                <p>₹699</p>

                <button onclick="addToCart()">
                    Add to Cart
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 MyShop. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
